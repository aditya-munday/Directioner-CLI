name: Directioner Release Validation

# Build and validate the Directioner-CLI **OS component** — the prebuilt Linux
# artifact Directioner-OS includes in its image — and upload it for review.
#
# This workflow is Directioner-owned and self-contained. It does NOT:
#   - publish to npm, or modify any registry state;
#   - create a GitHub release or tag;
#   - dispatch BeyondersAI/directioner-private or any legacy release workflow;
#   - require any provider API key, deploy secret, or vendor credential.
#
# The npm archive is built and validated too, but only as an internal,
# development-only artifact (the launcher path remains useful for local testing).
# It is never published and is not the customer distribution.
#
# Triggers are deliberately narrow. There is no `push: main` trigger because
# this workflow produces an artifact, not a release, and `main` is not modified.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (semver, e.g. 0.1.0)'
        required: false
        default: '0.1.0'
  pull_request:
    paths:
      - 'directioner/**'
      - 'scripts/validate-release.ts'
      - 'scripts/validate-component.ts'
      - 'scripts/build-component.ts'
      - 'scripts/package-manifest.ts'
      - 'scripts/bench-directioner.ts'
      - 'scripts/test-release-artifact.ts'
      - 'scripts/test-binary-offline.ts'
      - 'scripts/test-validator-failures.ts'
      - 'scripts/test-component-failures.ts'
      - 'scripts/test-component-runtime.ts'
      - 'scripts/net-guard.cjs'
      - '.github/workflows/directioner-release.yml'

# Least privilege: read the repo only. No secrets, no write scope.
permissions:
  contents: read

concurrency:
  group: directioner-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fixed, non-published version for PR runs; the manual run may override it.
  # Nothing here is derived from a secret.
  DIRECTIONER_VERSION: ${{ github.event.inputs.version || '0.1.0' }}

jobs:
  release-validation:
    name: Build component, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is used by the (internal) npm launcher and the artifact test.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux (required by Directioner e2e tests)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build SDK
        run: bun run build:sdk

      - name: Build Directioner binary
        run: bun directioner/cli/build.ts "$DIRECTIONER_VERSION"

      # --- The customer artifact: the Directioner-OS component --------------
      - name: Assemble OS component
        run: bun scripts/build-component.ts "$DIRECTIONER_VERSION"

      - name: Validate OS component (hard gate)
        run: bun scripts/validate-component.ts --expected-version "$DIRECTIONER_VERSION"

      - name: Component runtime test (staged out of the repo)
        run: bun scripts/test-component-runtime.ts directioner/cli/release/component "$DIRECTIONER_VERSION"

      - name: Component validator failure behavior
        run: bun scripts/test-component-failures.ts

      # --- Internal, development-only npm path (never published) ------------
      - name: Assemble internal npm package (development-only)
        run: bun directioner/cli/package-release.ts "$DIRECTIONER_VERSION"

      - name: Package-content manifest (internal)
        run: bun scripts/package-manifest.ts "directioner/cli/release/dist/directioner-$DIRECTIONER_VERSION.tgz"

      - name: Validate internal npm package
        run: bun scripts/validate-release.ts --expected-version "$DIRECTIONER_VERSION"

      - name: Validator failure behavior
        run: bun scripts/test-validator-failures.ts

      # --- Shared security and test gates ----------------------------------
      - name: Source egress guard
        run: bun scripts/check-no-vendor-egress.ts

      - name: Directioner unit tests
        run: bun test cli/src/__tests__/release/ cli/src/__tests__/terminal-reset-sequences.test.ts

      # Informational, not a gate: shared CI runners are noisy and a perf gate
      # that trips on that noise gets ignored. This records today's numbers as a
      # downloadable artifact so a regression can be seen in context. The gate
      # is a local run against a baseline saved with `--save` on the same
      # machine, since timings are not comparable across hardware.
      - name: Benchmark local hot paths
        run: bun scripts/bench-directioner.ts --json > directioner-perf.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: directioner-perf
          path: directioner-perf.json
          retention-days: 14

      - name: Directioner e2e tests
        run: bun test directioner/

      - name: Clean-install artifact test (internal npm path)
        run: bun scripts/test-release-artifact.ts "directioner/cli/release/dist/directioner-$DIRECTIONER_VERSION.tgz" "$DIRECTIONER_VERSION"

      - name: Binary offline check (network namespace)
        run: bun scripts/test-binary-offline.ts directioner/cli/release/component/bin/directioner "$DIRECTIONER_VERSION"

      - name: Upload OS component artifact
        uses: actions/upload-artifact@v4
        with:
          name: directioner-cli-component-${{ env.DIRECTIONER_VERSION }}
          path: directioner/cli/release/component/
          if-no-files-found: error
          retention-days: 14
